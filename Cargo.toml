[workspace]
members = [".", "pico-display", "pio-programs", "pio-test"]
default-members = [".", "pico-display", "pio-programs"]

[package]
edition = "2021"
name = "pico-github-stars"
authors = ["kromych"]
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.2"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5"
embassy-rp = { version = "0.10", features = [
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
    "boot2-generic-03h",
] }

pio = "0.3"
pico-display = { path = "pico-display" }
pio-programs = { path = "pio-programs" }

[[bin]]
name = "pico-github-stars"
test = false
bench = false

[[example]]
name = "matrix"
test = false
bench = false

[[example]]
name = "matrix_async"
test = false
bench = false

[[example]]
name = "color_bars"
test = false
bench = false

[[example]]
name = "color_bars_async"
test = false
bench = false

[[example]]
name = "bounce"
test = false
bench = false

[[example]]
name = "bounce_async"
test = false
bench = false

[[example]]
name = "dma_tests"
test = false
bench = false

[profile.release]
debug = 2
lto = true
opt-level = 3

[profile.dev]
debug = 2
lto = true
opt-level = "z"
