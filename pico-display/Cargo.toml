[package]
name = "pico-display"
version = "0.1.0"
edition = "2021"

[lib]
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm"] }
defmt = "1.0"
libm = "0.2"
pio = "0.3"
pio-proc = "0.3"
pio-programs = { path = "../pio-programs" }
embassy-rp = { version = "0.10", features = ["unstable-pac", "rp2040"] }
